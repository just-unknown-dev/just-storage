name: just_storage
description: "Standard and encrypted (AES-256-GCM) key-value storage for Flutter on every platform, with typed JSON helpers, change streams and an admin screen."
version: 2.0.0
homepage: https://github.com/just-unknown-dev/just-storage
repository: https://github.com/just-unknown-dev/just-storage
issue_tracker: https://github.com/just-unknown-dev/just-storage/issues
topics:
  - storage
  - encryption
  - key-value
  - persistence

screenshots:
  - description: "The storage workbench on a desktop, dark with coral accents: storages in the sidebar, entries, and a JSON value as a tree."
    path: assets/screenshots/workbench_desktop.png
  - description: "The storage workbench on phones: the storages, a storage's entries, and a save slot as a JSON tree."
    path: assets/screenshots/workbench_phone.png
  - description: "The storage workbench in light mode: a secure storage with its values shown, and one being edited as JSON."
    path: assets/screenshots/workbench_desktop_light.png

environment:
  sdk: ^3.11.0
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  # 3.x too: the encrypt package (used beside this one by just_database)
  # still pins pointycastle ^3.6.2.
  pointycastle: ">=3.7.3 <5.0.0"
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  vm_service: ^15.0.0
